name: CI

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Pin wasm-bindgen version
        run: cargo update -p wasm-bindgen --precise 0.2.129

      - name: Install matching wasm-bindgen CLI
        run: cargo install --locked --version 0.2.129 wasm-bindgen-cli

      - name: Build Wasm
        run: cargo build --target wasm32-unknown-unknown

      - name: Generate bindings
        run: |
          wasm-bindgen --version
          wasm-bindgen target/wasm32-unknown-unknown/debug/*.wasm --out-dir ./pkg --web
