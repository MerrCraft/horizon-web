name: Deploy Horizon web to GitHub Pages

on:
  push:
    branches: [web]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Setup Java 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'

      - name: Install stable Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install nightly and wasm target
        run: |
          rustup toolchain install nightly-2026-10-14 --profile minimal --component rust-src
          rustup target add wasm32-unknown-unknown

      - name: Read exact wasm-bindgen version from Cargo.lock
        id: wasm
        run: |
          VERSION=$(grep -A3 'name = "wasm-bindgen"' Cargo.lock | sed -n 's/.*version = "\(.*\)".*/\1/p' | head -n 1)
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Detected wasm-bindgen version: $VERSION"

      - name: Install wasm-bindgen CLI
        run: cargo install wasm-bindgen-cli --version "${{ steps.wasm.outputs.version }}" --locked

      - name: Install binaryen
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends binaryen

      - name: Prepare CI environment
        run: bash tools/ci/runner-env.sh

      - name: Prepare game resources
        run: bash tools/ci/vanilla-data.sh

      - name: Build browser bundle
        run: ./web/build.sh

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./web/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
