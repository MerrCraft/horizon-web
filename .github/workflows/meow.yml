name: Build and deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Pin wasm-bindgen version
        run: cargo update -p wasm-bindgen --precise 0.2.129

      - name: Install matching wasm-bindgen CLI
        run: cargo install --locked --version 0.2.129 wasm-bindgen-cli

      - name: Build Wasm
        run: cargo build --target wasm32-unknown-unknown

      - name: Generate bindings
        run: |
          wasm-bindgen --version
          wasm-bindgen target/wasm32-unknown-unknown/debug/*.wasm --out-dir ./pkg --web

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./pkg

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
