      - name: Install Rust toolchains and Wasm targets
        run: |
          rustup toolchain install stable --profile minimal
          rustup target add wasm32-unknown-unknown --toolchain stable
          rustup toolchain install nightly-2026-10-14 --profile minimal --component rust-src
          rustup target add wasm32-unknown-unknown --toolchain nightly-2026-10-14

      - name: Install matching wasm-bindgen CLI
        run: cargo install --locked --version 0.2.129 wasm-bindgen-cli

      - name: Build Pages site
        run: python3 web/package.py folder

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: web/out/horizon-web
